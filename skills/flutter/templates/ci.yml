name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: scripts/check.sh
      - name: Coverage summary (advisory)
        if: always()
        run: |
          echo "Line coverage: $(cat coverage/percent.txt 2>/dev/null || echo n/a)% (target 80%, advisory)" >> "$GITHUB_STEP_SUMMARY"
