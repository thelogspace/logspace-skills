# Keep only the project's ecosystems. Updates go to develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
  - package-ecosystem: pub        # Flutter
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm        # Next.js / Three.js / Phaser
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
