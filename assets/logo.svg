<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title">
  <title id="title">LogSpace Skills</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.65">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="170" cy="200" r="7" opacity="0.7"/>
      <circle cx="262" cy="120" r="4" opacity="0.5"/>
      <circle cx="860" cy="760" r="6" opacity="0.6"/>
      <circle cx="150" cy="820" r="5" opacity="0.45"/>
      <circle cx="905" cy="170" r="4" opacity="0.5"/>
      <circle cx="720" cy="900" r="4" opacity="0.4"/>
    </g>

    <!-- orbit + launched spark -->
    <g transform="rotate(-25 512 512)">
      <ellipse cx="512" cy="512" rx="370" ry="150" fill="none" stroke="url(#orbit)" stroke-width="26" opacity="0.9"/>
      <circle cx="795" cy="416" r="78" fill="url(#spark)"/>
      <circle cx="795" cy="416" r="26" fill="#FFFFFF"/>
    </g>

    <!-- terminal prompt >_ -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="76">
      <polyline points="352,390 488,512 352,634" stroke="#FFFFFF"/>
      <line x1="548" y1="634" x2="690" y2="634" stroke="#22D3EE"/>
    </g>
  </g>
</svg>
